<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | Ramdev Opticals</title>
<link rel="stylesheet" href="style.css">
<style>
.checkout{max-width:820px;margin:auto;padding:45px 6%}.box{background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:24px;margin-bottom:18px}
.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px}
.totalbox{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:18px;background:#eef1ee;border-radius:12px;margin:18px 0}
.upibox{background:#f3f4f6;border-radius:12px;padding:15px;margin:12px 0}.upi{font-size:19px;font-weight:800}
.pay{background:#16833b}.wa{background:#111}
.small{color:#666;font-size:13px}.hidden{display:none}.items{padding:0;margin:0;list-style:none}.items li{padding:8px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<header><a class="logo" href="index.html">RAMDEV <span>OPTICALS</span></a><nav><a href="index.html#products">Eyewear</a><a href="index.html#cart">Cart</a></nav></header>
<main class="checkout">
<a href="index.html">← Back to store</a>
<div class="box">
<h1>Checkout</h1>
<form id="form">
<div class="field"><label>Full name</label><input id="name" required></div>
<div class="field"><label>Mobile number</label><input id="mobile" type="tel" required></div>
<div class="field"><label>Delivery address</label><textarea id="address" rows="4" required></textarea></div>
<div class="field"><label>Order note (optional)</label><textarea id="note" rows="2"></textarea></div>
<div class="totalbox"><span>Total</span><span>₹<span id="total">0</span></span></div>
<div class="upibox">
<strong>Payment: PhonePe / UPI only</strong>
<div class="upi">rajeshrajpurohith@ybl</div>
<p class="small">COD is not available. Tap Pay with PhonePe / UPI to open a supported UPI app with the amount pre-filled.</p>
</div>
<button type="button" class="btn pay" id="pay">Pay with PhonePe / UPI</button>
<button type="submit" class="btn wa">Place Order & Send WhatsApp</button>
<p id="status" class="small"></p>
</form>
</div>
<div class="box"><h2>Your items</h2><ul class="items" id="items"></ul></div>
</main>
<script>
const UPI="rajeshrajpurohith@ybl", WA="918008564974";
const cart=JSON.parse(localStorage.getItem("ramdevCartV3")||"[]");
const itemPrice=i=>Number(i.totalPrice??i.total??i.price??i.framePrice??0);
const total=cart.reduce((s,i)=>s+itemPrice(i)*Number(i.qty??i.quantity??1),0);
document.getElementById("total").textContent=total.toLocaleString("en-IN");
document.getElementById("items").innerHTML=cart.length?cart.map(i=>`<li>${i.frame||i.name||"Eyewear"} × ${i.qty??i.quantity??1}${i.lens?` — ${i.lens}`:""}</li>`).join(""):"<li>Your cart is empty.</li>";

document.getElementById("pay").onclick=async()=>{
 if(total<=0){alert("Your cart is empty.");return;}
 const upi=`upi://pay?pa=${encodeURIComponent(UPI)}&pn=${encodeURIComponent("Ramdev Opticals")}&am=${total.toFixed(2)}&cu=INR&tn=${encodeURIComponent("Ramdev Opticals order")}`;
 location.href=upi;
};

function waText(id){
 const name=document.getElementById("name").value.trim(),mobile=document.getElementById("mobile").value.trim(),address=document.getElementById("address").value.trim(),note=document.getElementById("note").value.trim();
 let t=`Ramdev Opticals Order #${id}\n\nCustomer: ${name}\nMobile: ${mobile}\nAddress: ${address}\n`;
 if(note)t+=`Note: ${note}\n`;
 t+=`\nPayment: PhonePe / UPI\nUPI ID: ${UPI}\nTotal: ₹${total.toLocaleString("en-IN")}\n\nItems:\n`;
 cart.forEach((i,n)=>t+=`${n+1}. ${i.frame||i.name||"Eyewear"} × ${i.qty??i.quantity??1}${i.lens?` — ${i.lens}`:""}\n`);
 return encodeURIComponent(t);
}

document.getElementById("form").onsubmit=async e=>{
 e.preventDefault();
 if(!cart.length){status.textContent="Your cart is empty.";return;}
 status.textContent="Creating your order...";
 try{
  const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   customer_name:name.value.trim(),mobile:mobile.value.trim(),address:address.value.trim(),note:note.value.trim(),
   items:cart,total,payment_method:"PHONEPE_UPI",payment_status:"pending"
  })});
  const d=await r.json(); if(!r.ok)throw Error(d.error||"Could not create order");
  localStorage.removeItem("ramdevCartV3");
  status.textContent=`Order #${d.id} created. Opening WhatsApp...`;
  setTimeout(()=>location.href=`https://wa.me/${WA}?text=${waText(d.id)}`,500);
 }catch(err){status.textContent=err.message;}
};
</script>
</body></html>
