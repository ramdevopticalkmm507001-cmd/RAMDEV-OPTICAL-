<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ramdev Opticals — Eyewear for Everyone</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
      background:#f5f7fb;
      color:#172033
    }

    header{
      background:#111827;
      color:white;
      position:sticky;
      top:0;
      z-index:10;
      box-shadow:0 3px 15px #0002
    }

    .nav{
      max-width:1150px;
      margin:auto;
      padding:16px;
      display:flex;
      align-items:center;
      gap:20px
    }

    .logo{
      font-size:22px;
      font-weight:800;
      white-space:nowrap
    }

    .logo span{color:#60a5fa}

    .search{
      flex:1;
      min-width:150px
    }

    .search input{
      width:100%;
      padding:12px 16px;
      border:0;
      border-radius:10px;
      outline:none;
      font-size:15px
    }

    .cartbtn{
      color:white;
      text-decoration:none;
      font-weight:700;
      white-space:nowrap
    }

    .badge{
      background:#2563eb;
      padding:3px 8px;
      border-radius:20px;
      font-size:12px
    }

    .hero{
      max-width:1150px;
      margin:25px auto;
      padding:45px 25px;
      border-radius:22px;
      background:linear-gradient(135deg,#dbeafe,#eff6ff);
      text-align:center
    }

    .hero h1{
      font-size:42px;
      margin:0 0 10px
    }

    .hero p{
      font-size:18px;
      color:#475569;
      margin:0
    }

    .section{
      max-width:1150px;
      margin:25px auto;
      padding:0 16px
    }

    .section h2{
      margin-bottom:18px
    }

    #grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px
    }

    .card{
      background:white;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 4px 18px #0001;
      transition:.2s
    }

    .card:hover{
      transform:translateY(-3px);
      box-shadow:0 8px 25px #0002
    }

    .pic{
      height:150px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#eef2ff;
      font-size:65px
    }

    .body{
      padding:16px
    }

    .body h3{
      margin:0 0 5px;
      font-size:18px
    }

    .muted{
      color:#64748b;
      font-size:14px
    }

    .price{
      font-size:20px;
      font-weight:800;
      margin:10px 0
    }

    .btn{
      display:block;
      text-align:center;
      background:#2563eb;
      color:white;
      text-decoration:none;
      padding:10px;
      border-radius:9px;
      font-weight:700
    }

    .cart{
      max-width:1150px;
      margin:35px auto;
      padding:0 16px
    }

    .cartbox{
      background:white;
      border-radius:16px;
      padding:20px;
      box-shadow:0 4px 18px #0001
    }

    .cartrow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      padding:14px 0;
      border-bottom:1px solid #eee
    }

    .cartinfo{
      flex:1
    }

    .qty{
      display:flex;
      align-items:center;
      gap:8px
    }

    .qty button{
      border:1px solid #ddd;
      background:white;
      border-radius:7px;
      padding:5px 10px;
      cursor:pointer
    }

    .total{
      display:flex;
      justify-content:space-between;
      margin-top:18px;
      font-size:20px;
      font-weight:800
    }

    #checkout{
      width:100%;
      margin-top:15px;
      border:0;
      background:#16a34a;
      color:white;
      padding:13px;
      border-radius:10px;
      font-size:16px;
      font-weight:800;
      cursor:pointer
    }

    footer{
      margin-top:50px;
      padding:30px 16px;
      text-align:center;
      background:#111827;
      color:white
    }

    @media(max-width:900px){
      #grid{grid-template-columns:repeat(3,1fr)}
    }

    @media(max-width:650px){
      .nav{
        flex-wrap:wrap
      }

      .logo{
        width:100%;
        text-align:center
      }

      .search{
        order:2;
        width:100%
      }

      .cartbtn{
        margin:auto
      }

      .hero h1{
        font-size:30px
      }

      #grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px
      }

      .pic{
        height:120px;
        font-size:50px
      }

      .cartrow{
        flex-wrap:wrap
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      RAMDEV <span>OPTICALS</span>
    </div>

    <div class="search">
      <input id="search" type="search" placeholder="Search glasses, sunglasses...">
    </div>

    <a href="#cart" class="cartbtn">
      🛒 Cart <span id="cartCount" class="badge">0</span>
    </a>

  </div>
</header>

<section class="hero">
  <h1>Find Your Perfect Eyewear 👓</h1>
  <p>Optical frames, sunglasses and prescription lenses from Ramdev Opticals.</p>
</section>

<section class="section">
  <h2>Our Collection</h2>
  <div id="grid"></div>
</section>

<section class="cart" id="cart">
  <h2>Your Cart</h2>

  <div class="cartbox">

    <div id="cartItems">
      <p>Your cart is empty.</p>
    </div>

    <div class="total">
      <span>Total</span>
      <span id="cartTotal">₹0</span>
    </div>

    <button id="checkout">
      Proceed to Checkout
    </button>

  </div>
</section>

<footer>
  <b>RAMDEV OPTICALS</b>
  <p>Quality eyewear for everyone.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
