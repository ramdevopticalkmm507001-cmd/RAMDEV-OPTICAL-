<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configure | Ramdev Opticals</title><link rel="stylesheet" href="style.css"><style>
main{max-width:1050px;margin:auto;padding:45px 6%}.config{display:grid;grid-template-columns:1fr 1fr;gap:22px}.box{background:white;border:1px solid #e5e5e5;border-radius:16px;padding:22px}.preview{height:320px;background:#edf0ed;border-radius:16px;display:grid;place-items:center;font-size:110px}.field{margin:14px 0}label{display:block;font-weight:700;margin-bottom:6px}select,input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;background:white}.totalbox{margin:20px 0;padding:18px;border-radius:12px;background:#eef1ee;font-size:22px;font-weight:800}.note{font-size:13px;color:#666}@media(max-width:750px){.config{grid-template-columns:1fr}}
</style></head><body><header><a class="logo" href="index.html">RAMDEV <span>OPTICALS</span></a><nav><a href="index.html#products">Eyewear</a><a href="index.html#cart">Cart</a></nav></header>
<main><a href="index.html">← Back</a><div class="config" style="margin-top:25px"><section><div class="preview" id="preview">👓</div><div class="box"><small>FRAME</small><h1 id="fname"></h1><p id="ftype" class="note"></p><b id="fprice"></b></div></section>
<section class="box"><small>LENS + PRESCRIPTION</small><div class="field"><label>Lens family</label><select id="family"></select></div><div class="field"><label>Lens product</label><select id="lens"></select></div><div class="field"><label>Price option / power range</label><select id="power"></select></div>
<div class="field"><label>SPH</label><input id="sph" placeholder="e.g. -2.00"></div><div class="field"><label>CYL</label><input id="cyl" placeholder="e.g. -1.00"></div><div class="field"><label>AXIS</label><input id="axis" placeholder="e.g. 90"></div><div class="field"><label>ADD</label><input id="add" placeholder="If applicable"></div>
<p class="note">Enter the prescription exactly as provided by the customer's eye-care professional. This site does not diagnose or validate prescriptions.</p><div class="totalbox" id="total">Total: ₹0</div><button class="btn" id="addBtn">Add configured glasses to cart</button><p id="done" class="note"></p></section></div></main>
<script src="script.js"></script><script>
const p=new URLSearchParams(location.search),id=Number(p.get('id'))||1,frame=products.find(x=>x.id===id)||products[0];
fname.textContent=frame.name;ftype.textContent=frame.type;fprice.textContent=money(frame.price);preview.textContent=frame.icon;
const D=[["Eyeconic Blue Cut",[["1.60 Eyeconic Dual",[1100,1200,1400,1900]],["1.56 Crystal Blue",[900,1000,1200,1600]],["1.60 Violet Dark Blue",[900,1000,1200,1600]],["1.56 Crystal Green",[900,1000,1200]],["1.60 Eyeconic Magenta Night Drive",[1000,1100,1300]]]],["ASH Blue Cut",[["ASH Blue Cut 1.60 HMC Green",[700,800,1200,2800]],["1.56 55MM Blue Cut HMC Green",[1500,1700,1800]]]],["Diamond Photochromic",[["1.56 Diamond Photogray HC",[1000,1200,1600,2200]],["1.56 Diamond Photogray HMC Green",[1600,1800,2200,2800]],["1.56 Sun-Sync Photogray HMC Blue Coat",[1800,2000,2400]]]],["Elite Photogray Blue Cut",[["1.56 Elite Single Vision Green Coat SHMC",[1600,2000,2200]],["1.56 Elite Round Top Blue Coat",[1800,2000,2400]],["1.56 Elite Progressive Blue Coat",[2500,2800,3000]]]],["White Progressive",[["1.56 Shield Progressive HC",[1000,1300,1300,1500,1700]],["1.56 Radiator Progressive HMC",[1300,1600,1600,1800,2000]],["1.59 Bullet Poly-Carbonate Progressive HMC Green Coat",[2500]]]],["Blue Cut Progressive",[["1.56 Blue Cut Progressive HMC Green Coat",[1600,1800,1800,2000,2200]],["1.56 Infinity Blue Cut Progressive HMC Blue Coat",[2100,2300,2300]]]],["Photogray Progressive",[["1.56 Super Shield Photogray Progressive HC",[1600,2000,2000,2400]],["1.56 Sun Radiator Photogray Progressive HMC",[2200,2600,2600,3000]]]],["White Round Top",[["1.56 White Round Top HC",[600,800,800,1000,1000,1000,1000,1200,1200]]]],["Photogray Round Top",[["1.56 Super Shield Photogray Round Top HC",[1000,1400,1200,1300,1500,1500,1500,1600]],["1.56 Sun Radiator Photogray Round Top HMC Green Coat",[1600,1800,2000,2200]]]],["Blue Cut Round Top HMC",[["Protector Blue Cut Round Top HMC Green Coat",[1000,1200,1300,1500,1700,1500,1700,1900]],["Infinity Blue Cut Round Top HMC Blue Coat",[1500,1700,1900,2100]]]],["High Powered Lenses",[["1.56 55MM Plus Thin Lenses",[600,800,1000,1200,800,1000,1200]],["1.56 Lenticular Plus Lenses",[1200,1400,600,950,1150,1350,1550,1750,600,900,1250,1450,1650,1850,2050,600,700]],["1.56 Diamond Minus Lenses",[900,1200,1550,1950,2150,2350,900,1000]]]]];
function families(){family.innerHTML=D.map((x,i)=>`<option value="${i}">${x[0]}</option>`);lensFill()}function lensFill(){lens.innerHTML=D[family.value][1].map((x,i)=>`<option value="${i}">${x[0]}</option>`);powerFill()}function powerFill(){power.innerHTML=D[family.value][1][lens.value][1].map((v,i)=>`<option value="${i}">Option ${i+1} — ${money(v)}</option>`);calc()}function calc(){let lp=D[family.value][1][lens.value][1][power.value];total.textContent='Total: '+money(frame.price+lp)}family.onchange=lensFill;lens.onchange=powerFill;power.onchange=calc;
addBtn.onclick=()=>{let lp=D[family.value][1][lens.value][1][power.value],ln=D[family.value][1][lens.value][0],rx={sph:sph.value,cyl:cyl.value,axis:axis.value,add:add.value};let c=JSON.parse(localStorage.getItem('ramdevCartV3')||'[]'),item={key:Date.now(),frame:frame.name,lens:ln,prescription:rx,total:frame.price+lp,qty:1};c.push(item);localStorage.setItem('ramdevCartV3',JSON.stringify(c));done.textContent='Added to cart successfully.';setTimeout(()=>location.href='index.html#cart',500)};families();
</script></body></html>
